# Remove the include below to disconnect Kitty from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Shell
shell /usr/bin/fish

# Font
# font_family JetBrainsMono Nerd Font
font_size 10.0

# Window padding
# window_padding_width 14

# Cursor: thin I-beam that glides between line jumps.
cursor_shape beam
cursor_beam_thickness 1.6

# Soft fading blink instead of a hard on/off toggle.
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 0

# Animated trail behind cursor jumps (line changes, prompt moves).
# 200 = cursor must rest 200ms before its move is animated.
cursor_trail 200
cursor_trail_decay 0.06 0.28
cursor_trail_start_threshold 1 1

# Frosted-glass background: Hyprland blurs what shows through.
# Range 0.0 (invisible) - 1.0 (opaque). Raise if text is hard to read.
background_opacity 0.5
